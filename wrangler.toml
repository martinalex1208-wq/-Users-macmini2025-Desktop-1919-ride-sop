name = "vibe-market-radar"
main = ".open-next/worker.js"
compatibility_date = "2026-05-16"

[[kv_namespaces]]
binding = "MARKET_HISTORY_KV"
id = "replace-with-history-kv-id"

[[kv_namespaces]]
